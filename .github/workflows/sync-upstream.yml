name: Sync Upstream

on:
  schedule:
    - cron: '0 3 * * *'   # 每天 UTC 03:00（北京时间 11:00）
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Add upstream
        run: |
          git remote add upstream https://github.com/wangwangit/SubsTracker || true
          git fetch upstream

      - name: Merge upstream master
        run: |
          git checkout main
          git merge upstream/master || echo "No changes to merge"

      - name: Push changes
        run: |
          git push origin main || echo "Nothing to push"
